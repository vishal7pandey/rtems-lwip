repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: clang-format-staged-lines
        name: clang-format changed C/C++ lines
        entry: anvil-clang-format-staged
        language: system
        pass_filenames: false
        always_run: true

      - id: cppcheck-changed-c
        name: cppcheck changed C files
        entry: cppcheck --enable=warning,performance,portability --error-exitcode=1
        language: system
        types: [c]

      - id: commit-message-format
        name: commit message must start with ISSUE-123:
        entry: bash -c 'grep -Eq "^[A-Z]+-[0-9]+: .+" "$1"' --
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
